name: Desktop release

on:
  push:
    tags:
      - '**'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            signing_identity: '-'
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            signing_identity: '-'
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            signing_identity: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Test JavaScript
        run: npm run test:flow

      - name: Test Rust
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build and publish desktop app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.signing_identity }}
        with:
          tauriScript: npm exec -- tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: Local Agent ${{ github.ref_name }}
          releaseBody: Download the installer for your operating system below.
          uploadWorkflowArtifacts: false
