name: Desktop release

on:
  push:
    tags:
      - '**'

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft=true
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Local Agent $GITHUB_REF_NAME" \
              --notes "Mac installers are uploaded by this workflow. Add the Windows installer before publishing this draft."
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Test JavaScript
        run: npm run test:flow

      - name: Test Rust
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build macOS DMG
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm exec -- tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Upload DMG to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg --clobber
